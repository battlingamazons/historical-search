function renderFacets() {
  applyLayout();
  const facets = document.getElementById('facets');
  const layout = document.getElementById('layout');
  // A chosen dataset with nothing in this search is still listed, ticked, so
  // it can be unticked -- otherwise a narrowing would trap the person in an
  // empty list with no way out.
  const known = new Set(datasetList.map(d => d.name));
  const rows = datasetList.concat([...chosenDatasets].filter(n => !known.has(n)).map(name => ({ name, count: 0 })));
  const hasPictures = pictureCount > 0 || !pictureEl.hidden;
  if (!hasPictures) pictureView = 'all';
  document.querySelector('.wrap').dataset.view = pictureView;
  const show = hasPictures || searchHistory.length > 0 || (rows.length > 0 && (rows.length > 1 || chosenDatasets.size > 0));
  facets.hidden = !show;
  layout.classList.toggle('has-facets', show);
  document.querySelector('.wrap').classList.toggle('has-facets', show);
  if (!show) { facets.innerHTML = ''; return; }
  // Which kind of result to look at: the pictures are listed beneath the
  // records, where a long list would bury them.
  const recordCount = (resultsTotal || 0) + resultsEl.querySelectorAll('.result.loose').length;
  const kindRow = (value, name, n) => `
    <label>
      <input type="radio" name="result-kind" value="${value}" ${pictureView === value ? 'checked' : ''}>
      <span class="name">${name}</span>${n === null ? '' : `<span class="n">${n.toLocaleString()}</span>`}
    </label>`;
  const kinds = hasPictures ? `<div class="kinds"><h2>Show</h2>` +
    kindRow('all', 'Everything', null) +
    kindRow('records', 'Catalog records', recordCount) +
    kindRow('pictures', pictureLabel, pictureCount) + `</div>` : '';
  const history = searchHistory.length ? `<div class="history"><h2>Recent searches</h2>` + searchHistory.map((h, i) =>
    `<button type="button" data-history="${i}" class="${h.key === currentHistoryKey ? 'current' : ''}">` +
    `<span class="kind">${h.kind === 'scan' ? '&#128247;' : '&#128269;'}</span>${escapeHtml(h.label)}</button>`).join('') + `</div>` : '';
  facets.innerHTML = kinds + (rows.length ? `<h2>Narrow by dataset</h2>` : '') + rows.map(d => `
    <label class="${d.count === 0 ? 'none' : ''}">
      <input type="checkbox" data-dataset="${escapeHtml(d.name)}" ${chosenDatasets.has(d.name) ? 'checked' : ''}>
      <span class="name">${escapeHtml(d.name || '(no name)')}</span>
      <span class="n">${d.count.toLocaleString()}</span>
    </label>`).join('') +
    (chosenDatasets.size ? `<button type="button" id="facets-clear">Show all datasets</button>` : '') + history;
  facets.querySelectorAll('[data-history]').forEach(b => b.addEventListener('click', () => goToHistory(searchHistory[Number(b.dataset.history)])));
  facets.querySelectorAll('input[name="result-kind"]').forEach(radio => {
    radio.addEventListener('change', () => {
      pictureView = radio.value;
      document.querySelector('.wrap').dataset.view = pictureView;
    });
  });
  facets.querySelectorAll('input[data-dataset]').forEach(box => {
    box.addEventListener('change', () => {
      if (box.checked) chosenDatasets.add(box.dataset.dataset); else chosenDatasets.delete(box.dataset.dataset);
      searchAgain();
    });
  });
  const clear = document.getElementById('facets-clear');
  if (clear) clear.addEventListener('click', () => { chosenDatasets.clear(); searchAgain(); });
}

// Bumped whenever the list of results is replaced or emptied. A page of extra
// results fetched before that happened belongs to a list that no longer
// exists, and appending it puts records on screen twice -- or brings a
// cleared search back. Tracking the query alone was not enough: pressing
// Enter for everything, and clearing the box, both leave the query as it was.
let resultsGeneration = 0;
let currentItemIndex = -1;
// Stepping through records follows whichever list the record was opened from:
// the ordinary results, or the pictures listed beneath them.
let navSource = 'results';
let pictureOrder = [];
let pictureHasMore = false;

function navList() {
  return navSource === 'pictures'
    ? { order: pictureOrder, total: pictureOrder.length, hasMore: pictureHasMore, more: pictureMore, plus: pictureHasMore ? '+' : '' }
    : { order: resultOrder, total: resultsTotal, hasMore: resultsHasMore, more: loadMoreResults, plus: '' };
}
// Which request the overlay is currently waiting on. Every panel -- a record,
// Settings, Diagnostics -- is fetched before it can be shown, and each
// used to paint whenever its answer arrived, whether or not it was still
// wanted. So dismissing one that was slow brought it back by itself, and
// choosing a different one meant whichever answered last won.
let overlayRequestId = 0;

function clearResults() {
  hidePictureSection();
  resultsGeneration += 1;
  resultOrder = [];
  currentOffset = 0;
  resultsHasMore = false;
  resultsTotal = 0;
  countEl.textContent = '';
  resultsEl.innerHTML = '';
  datasetList = [];
  currentTerms = [];
  currentWords = [];
  renderFacets();
}

function resultCardHtml(r, terms) {
  return `
    <div class="result${r.is_exact_id ? ' exact-match' : ''}" data-id="${r.id}">
      ${r.has_image
        ? `<img class="thumb" src="${imgUrl('thumb', r.id)}" loading="lazy" alt=""
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb-placeholder',textContent:'\u{1F4C4}'}))">`
        : `<div class="thumb-placeholder">&#128196;</div>`}
      <div class="result-body">
        <div class="top">
          <div class="id-row">
            ${r.is_document
              ? `<span class="accessno-badge doc">${docKindLabel({ kind: r.document_kind })}</span>`
              : r.accessno
                ? `<span class="accessno-badge${r.is_exact_id ? ' exact' : ''}">${escapeHtml(r.accessno)}</span>`
                : `<span class="accessno-badge missing">No ID on file</span>`}
            ${r.is_exact_id ? `<span class="exact-tag">Exact ID match</span>` : ''}
          </div>
          <div class="meta">${escapeHtml(r.catalog)}</div>
        </div>
        <div class="title">${highlight(r.title, terms)}</div>
        ${r.snippet ? `<div class="snippet">${highlight(r.snippet, terms)}…</div>` : ''}
      </div>
    </div>
  `;
}

// Set while a scan's matches are on screen and can be extended.
let scanMoreHandler = null;

function loadMoreResults() {
  if (scanMoreHandler) {
    const go = scanMoreHandler;
    const b = document.getElementById('show-more-btn');
    if (b) { b.disabled = true; b.textContent = 'Loading…'; }
    return go();
  }
  const btn = document.getElementById('show-more-btn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Loading…';
  }
  // Remember which list this page belongs to. If it has been replaced or
  // emptied while this was in flight -- a new search, Enter for everything,
  // or the clear button -- these rows belong to a list that is no longer on
  // screen and must not be appended to whatever replaced it.
  const queryWhenRequested = currentQuery;
  const generationWhenRequested = resultsGeneration;
  return invoke('search', searchArgs(queryWhenRequested, currentOffset, false))
    .then(data => {
      if (generationWhenRequested !== resultsGeneration) return data; // superseded
      render(data, queryWhenRequested, true);
      return data;
    })
    .catch(err => {
      // Without this the button sits on "Loading…" forever if the call fails.
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Show more results';
      }
      throw err;
    });
}

function searchAll() {
  const value = q.value;
  if (!value.trim()) return;
  clearTimeout(timer);
  const myId = ++requestId;
  countEl.textContent = 'Loading all results…';
  invoke('search', searchArgs(value, 0, true))
    .then(data => { if (myId === requestId) render(data, value); });
}

function render(data, query, append) {
  if (!append) scanMoreHandler = null;
  if (!append) {
    queuePictureSearch(query);
    currentTerms = data.terms || query.split(/\s+/).filter(Boolean);
    currentWords = data.words || [];
    resultsGeneration += 1;
    currentQuery = query;
    currentOffset = 0;
    resultOrder = [];
    resultsEl.innerHTML = '';
    datasetList = data.datasets || [];
    renderFacets();
    if (data.results.length === 0) {
      resultsHasMore = false;
      resultsTotal = 0;
      countEl.textContent = '';
      resultsEl.innerHTML = query.trim()
        ? `<div class="empty">${chosenDatasets.size ? 'No matches in the chosen datasets.' : 'No matches.'}</div>`
        : '';
      applyLayout();
      return;
    }
  }

  const existingMoreBtn = document.getElementById('show-more-btn');
  if (existingMoreBtn) existingMoreBtn.remove();

  const terms = currentTerms;
  resultsEl.insertAdjacentHTML('beforeend', data.results.map(r => resultCardHtml(r, terms)).join(''));
  resultsEl.querySelectorAll('.result:not([data-wired])').forEach(el => {
    el.setAttribute('data-wired', '1');
    el.addEventListener('click', () => openItem(el.dataset.id, 'results'));
  });

  resultOrder = resultOrder.concat(data.results.map(r => String(r.id)));
  resultsHasMore = data.has_more;
  resultsTotal = data.total;
  currentOffset += data.results.length;
  countEl.textContent = resultsTotal.toLocaleString() + ' result' + (resultsTotal === 1 ? '' : 's');

  if (data.has_more) {
    resultsEl.insertAdjacentHTML('beforeend', `<button type="button" id="show-more-btn" class="show-more-btn">Show more results</button>`);
    document.getElementById('show-more-btn').addEventListener('click', loadMoreResults);
  }
  applyLayout();
}

function navigate(delta) {
  const nav = navList();
  const newIndex = currentItemIndex + delta;
  if (newIndex < 0) return;
  if (newIndex >= nav.order.length) {
    if (nav.hasMore && nav.more) {
      const source = navSource;
      nav.more()
        .then(() => {
          const now = navList();
          if (source === navSource && newIndex < now.order.length) openItem(now.order[newIndex]);
        })
        .catch(err => reportToLog('error', `loading more results while stepping through items failed: ${err}`));
    }
    return;
  }
  openItem(nav.order[newIndex]);
}

function openItem(id, source) {
  destroyViewer();
  id = String(id);
  if (source) navSource = source;
  currentItemIndex = navList().order.indexOf(id);
  const myRequest = ++overlayRequestId;

  invoke('get_item', { id: Number(id) }).then(item => {
    // A newer request has since been made (rapid Next / held arrow key);
    // drop this one so the card and the position counter can't disagree.
    if (myRequest !== overlayRequestId) return;
    if (!item) return;
    card.className = item.document ? 'card wide' : 'card';
    const images = item.images || [];
    // A record can have several images -- the front and back of an object,
    // the pages of a letter -- each with its own caption.
    const imageBlock = images.length
      ? `<img class="full" id="main-image" alt="" title="Click to view larger" hidden>
         <div class="no-preview" id="main-image-fallback" hidden></div>
         <div class="image-caption" id="image-caption"></div>
         ${images.length > 1
            ? `<div class="image-position" id="image-position"></div>
               <div class="image-strip">${images.map((img, i) =>
                 `<button type="button" class="strip-thumb${i === 0 ? ' selected' : ''}" data-index="${i}"
                          title="${escapeHtml(img.caption || ('Image ' + (i + 1)))}">
                    <img src="${imgUrl(img.kind, img.id)}" loading="lazy" alt=""
                         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'strip-thumb-failed',textContent:'\u{26A0}'}))">
                  </button>`).join('')}</div>`
            : ''}
         <div class="image-actions">
           <button type="button" class="download-link" id="enlarge-btn">&#128269; View larger</button>
           <button type="button" class="download-link" id="open-image-btn">&#128444; Open in your photo viewer</button>
           <button type="button" class="download-link" id="similar-btn">&#128269; Find similar pictures</button>
           <button type="button" class="download-link" id="download-btn"></button>
         </div>
         <div class="validate-msg bad" id="open-image-msg" hidden></div>`
      : '';
    const hasNav = currentItemIndex !== -1;
    const atStart = currentItemIndex <= 0;
    const nav = navList();
    const atEnd = currentItemIndex >= nav.order.length - 1 && !nav.hasMore;
    const navRow = hasNav ? `
      <div class="item-nav">
        <button type="button" class="nav-btn" id="prev-item-btn" ${atStart ? 'disabled' : ''}>&larr; Previous</button>
        <span class="nav-position">${currentItemIndex + 1} of ${nav.total.toLocaleString()}${nav.plus}</span>
        <button type="button" class="nav-btn" id="next-item-btn" ${atEnd ? 'disabled' : ''}>Next &rarr;</button>
      </div>` : '';
    card.innerHTML = `
      <button class="close" aria-label="Close">&times;</button>
      ${navRow}
      <div class="catalog-tag">${escapeHtml(item.catalog)}</div>
      <div>
        ${item.document
          ? `<span class="accessno-badge doc">${docKindLabel(item.document)}${(!item.document.kind || item.document.kind === 'pdf') && item.document.pages > 0
              ? ` · ${item.document.pages} ${item.document.pages === 1 ? 'page' : 'pages'}` : ''}</span>`
          : item.accessno
            ? `<span class="accessno-badge">${escapeHtml(item.accessno)}</span>`
            : `<span class="accessno-badge missing">No ID on file</span>`}
      </div>
      <h2>${escapeHtml(item.title)}</h2>
      ${item.document
        ? `<div class="doc-actions">
             <button type="button" class="download-link" id="open-pdf-btn">&#128196; ${item.document.kind === 'word' ? 'Open in your word processor' : (item.document.kind === 'text' || item.document.kind === 'markdown') ? 'Open in your text editor' : 'Open in your PDF viewer'}</button>
             <button type="button" class="download-link" id="reveal-pdf-btn">Show in folder</button>
           </div>
           <div class="validate-msg bad" id="open-pdf-msg" hidden></div>
           <div class="doc-pages" id="doc-pages" hidden></div>
           <div class="pdf-viewer" id="pdf-viewer"></div>`
        : ''}
      ${imageBlock}
      ${item.fields.map(f => `
        <div class="field">
          <div class="label">${escapeHtml(f.label)}</div>
          <div class="value">${escapeHtml(f.value)}</div>
        </div>
      `).join('')}
    `;
    card.querySelector('.close').addEventListener('click', closeItem);
    // The id, not a path: the window never holds where the file is.
    const openPdfBtn = card.querySelector('#open-pdf-btn');
    if (openPdfBtn) {
      openPdfBtn.addEventListener('click', () => {
        const msg = card.querySelector('#open-pdf-msg');
        msg.hidden = true;
        invoke('open_document', { id: item.id }).catch(err => {
          // Said on the card, beside the button that was pressed: a PDF that
          // was moved or deleted since the index was built is an ordinary
          // thing to meet, and a button that quietly does nothing is not an
          // answer. The viewer below is the way round a computer that will
          // not hand the file to its PDF program.
          msg.textContent = String(err) + ' The page below shows it without needing another program.';
          msg.hidden = false;
        });
      });
      card.querySelector('#reveal-pdf-btn').addEventListener('click', () => {
        const msg = card.querySelector('#open-pdf-msg');
        msg.hidden = true;
        invoke('reveal_document', { id: item.id }).catch(err => {
          msg.textContent = String(err);
          msg.hidden = false;
        });
      });
      showDocument(item, myRequest);
    }
    card.querySelector('#prev-item-btn')?.addEventListener('click', () => navigate(-1));
    card.querySelector('#next-item-btn')?.addEventListener('click', () => navigate(1));

    const downloadBtn = card.querySelector('#download-btn');
    if (images.length) {
      const mainImage = card.querySelector('#main-image');
      const fallbackEl = card.querySelector('#main-image-fallback');
      const captionEl = card.querySelector('#image-caption');
      const positionEl = card.querySelector('#image-position');
      let selected = 0;

      // Show a plain explanation instead of a broken-image icon, and record
      // it. A picture that will not display is the likeliest complaint from a
      // platform this has not been run on, and a broken icon says nothing
      // about why.
      function showPreviewFailed(message, detail) {
        mainImage.hidden = true;
        mainImage.removeAttribute('src');
        fallbackEl.hidden = false;
        fallbackEl.textContent = message;
        if (detail) reportToLog('error', detail);
      }

      mainImage.addEventListener('error', () => {
        // Only meaningful once a source has actually been set.
        if (!mainImage.getAttribute('src')) return;
        showPreviewFailed(
          'This image could not be displayed. The original may still download.',
          `detail card image failed to load in the webview: ${mainImage.getAttribute('src')}`
        );
      });

      // The download offer names what the user will actually get. Only some
      // images have a high-resolution master behind them; for the rest the
      // Images folder holds PastPerfect's downsized display copy and there is
      // nothing larger to hand over, so promising "full resolution" would be
      // untrue.
      const downloadLabel = () => images[selected].has_master
        ? '⬇ Download full-resolution original'
        : '⬇ Download image';

      function showImage(i) {
        selected = i;
        const img = images[i];
        if (img.has_thumb) {
          fallbackEl.hidden = true;
          mainImage.hidden = false;
          mainImage.src = imgUrl(img.kind, img.id);
        } else {
          // The indexer could not turn this file into a preview -- an
          // unsupported format, or an unreadable file. The results list
          // already shows a placeholder in this case; the card used to show
          // a broken image instead.
          showPreviewFailed('No preview could be made for this image. The original may still download.');
        }
        captionEl.textContent = img.caption || '';
        captionEl.hidden = !img.caption;
        if (positionEl) positionEl.textContent = `Image ${i + 1} of ${images.length}`;
        card.querySelectorAll('.strip-thumb').forEach(btn => {
          btn.classList.toggle('selected', Number(btn.dataset.index) === i);
        });
        downloadBtn.textContent = downloadLabel();
      }

      card.querySelectorAll('.strip-thumb').forEach(btn => {
        btn.addEventListener('click', () => showImage(Number(btn.dataset.index)));
      });
      showImage(0);

      // Enlarging and opening elsewhere are by image id, never a path.
      const enlargeBtn = card.querySelector('#enlarge-btn');
      const openImageBtn = card.querySelector('#open-image-btn');
      const imageMsg = card.querySelector('#open-image-msg');
      const showImageMsg = (text) => { imageMsg.textContent = text; imageMsg.hidden = !text; };
      // A promise, so whoever asked can show the reason it failed where the
      // person is looking: on the card, or in the enlarged view.
      const openExternal = (i) => invoke('open_image', { kind: images[i].kind, id: images[i].id });
      // A picture the indexer could not make a preview of cannot be enlarged
      // either; the original may still open in the computer's own viewer.
      const syncEnlarge = () => {
        enlargeBtn.disabled = !images[selected].has_thumb;
        mainImage.classList.toggle('zoomable', Boolean(images[selected].has_thumb));
      };
      const showLarger = async () => {
        if (!images[selected].has_thumb) return;
        showImageMsg('');
        let lightbox;
        try {
          lightbox = await import('./lightbox.mjs');
        } catch (err) {
          reportToLog('error', `the enlarged view could not be loaded: ${err && err.stack ? err.stack : err}`);
          showImageMsg('The larger view could not be opened here. "Open in your photo viewer" will still work.');
          return;
        }
        lightbox.openLightbox({
          title: item.title,
          count: images.length,
          index: selected,
          load: async (i) => {
            const picked = images[i];
            await invoke('prepare_large_image', { kind: picked.kind, id: picked.id });
            return { url: imgUrl(picked.kind === 'imgthumb' ? 'large' : 'largeitem', picked.id), caption: picked.caption || '' };
          },
          openExternal,
          onIndex: (i) => showImage(i),
        });
      };
      enlargeBtn.addEventListener('click', showLarger);
      mainImage.addEventListener('click', showLarger);
      openImageBtn.addEventListener('click', () => {
        showImageMsg('');
        openExternal(selected).catch(err => showImageMsg(String(err)));
      });
      const similarBtn = card.querySelector('#similar-btn');
      if (similarBtn) {
        similarBtn.addEventListener('click', () => {
          // Exactly as if this picture had been dropped on the window.
          const picked = images[selected];
          const path = 'record-image:' + picked.kind + ':' + picked.id;
          scanLabels[path] = item.title;
          closeItem();
          checkScan(path, null);
          window.scrollTo(0, 0);
        });
      }
      const baseShowImage = showImage;
      showImage = (i) => { baseShowImage(i); syncEnlarge(); };
      syncEnlarge();

      downloadBtn.addEventListener('click', () => {
        const restoreLabel = downloadLabel();
        downloadBtn.disabled = true;
        downloadBtn.textContent = 'Saving…';
        // Number the filename when there are several, so saving every image
        // of one record doesn't have each overwrite the last.
        const base = ((item.accessno || item.title || 'image').replace(/[^\w\s.,()-]/g, '').trim() || 'image');
        const suggestedName = images.length > 1 ? `${base}-${selected + 1}` : base;
        invoke('download_image', { kind: images[selected].kind, id: images[selected].id, suggestedName }).then(saved => {
          downloadBtn.disabled = false;
          downloadBtn.textContent = saved ? 'Saved ✓' : restoreLabel;
          if (saved) setTimeout(() => { downloadBtn.textContent = downloadLabel(); }, 1800);
        }).catch(err => {
          downloadBtn.disabled = false;
          downloadBtn.textContent = restoreLabel;
          alert('Could not save the image: ' + err);
        });
      });
    }

    overlay.hidden = false;
  }).catch(err => {
    // Without this the card simply never opens and nothing says why -- and
    // on an untested platform "clicking a result does nothing" is exactly the
    // report that arrives with no detail attached.
    if (myRequest !== overlayRequestId) return;
    reportToLog('error', `could not open item ${id}: ${err}`);
    alert('This item could not be opened: ' + err);
  });
}

/// The words a person typed, lower-cased -- what the pages are matched on.
let currentViewer = null;
function destroyViewer() {
  if (currentViewer) {
    try { currentViewer.destroy(); } catch (e) { /* already gone */ }
    currentViewer = null;
  }
}

function docKindLabel(doc) {
  return doc.kind === 'word' ? 'Word' : doc.kind === 'markdown' ? 'Markdown' : doc.kind === 'text' ? 'Text' : 'PDF';
}

/// Fills a PDF's card: the pages the search matched, and the first of them
/// shown. A page is the thing a person wants -- not "the document matched".
async function showDocument(item, myRequest) {
  const host = card.querySelector('#pdf-viewer');
  // A Word or text file has no pages to draw: show its words, with the typed
  // ones marked.
  if (item.document.kind && item.document.kind !== 'pdf') {
    let text = null;
    try { text = await invoke('read_document_text', { id: item.id }); } catch (e) { text = null; }
    if (myRequest !== overlayRequestId) return;
    host.innerHTML = text
      ? `<div class="doc-text">${highlight(text, currentWords)}</div>`
      : '<div class="pdf-note">No words could be read from this file, so only its name and folder are searchable.</div>';
    return;
  }
  const list = card.querySelector('#doc-pages');
  const terms = currentWords;
  let hits = [];
  try {
    hits = terms.length ? await invoke('find_pages', { id: item.id, query: q.value }) : [];
  } catch (e) {
    hits = [];
  }
  if (myRequest !== overlayRequestId) return;

  const rows = (hits || []).map(h => `
    <button type="button" class="page-row" data-page="${h.page}">
      <span class="page-no">Page ${h.page}</span>
      <span class="page-snippet">${highlight(h.snippet, terms)}</span>
    </button>`);
  if (rows.length) {
    list.innerHTML = rows.join('');
    list.hidden = false;
  }

  if (!item.document.size) {
    host.innerHTML = '<div class="pdf-note">The PDF is no longer where the index recorded it. It may have been moved or renamed -- refreshing the index will update the list.</div>';
    return;
  }
  host.innerHTML = '<div class="pdf-note">Opening the PDF…</div>';
  try {
    const { mountViewer } = await import('./viewer.mjs');
    if (myRequest !== overlayRequestId) return;
    const viewer = await mountViewer(host, {
      read: (start, end) => invoke('read_document_range', { id: item.id, start, end }),
      size: item.document.size,
      startPage: hits.length ? hits[0].page : 1,
      terms,
      onPage: (n) => {
        for (const row of list.querySelectorAll('.page-row')) {
          row.classList.toggle('current', Number(row.dataset.page) === n);
        }
      },
    });
    if (myRequest !== overlayRequestId) { viewer.destroy(); return; }
    destroyViewer();
    currentViewer = viewer;
    list.addEventListener('click', (event) => {
      const row = event.target.closest('.page-row');
      if (row) viewer.goTo(Number(row.dataset.page));
    });
  } catch (err) {
    if (myRequest !== overlayRequestId) return;
    host.innerHTML = '<div class="pdf-note">The page could not be shown here (' +
      escapeHtml(String(err && err.message ? err.message : err)) +
      '). <em>Open in your PDF viewer</em> above will still work.</div>';
    reportToLog('error', `the PDF viewer failed: ${err && err.stack ? err.stack : err}`);
  }
}

function closeItem() {
  destroyViewer();
  // Any record still on its way belongs to a card that is no longer open.
  // Without discarding it, dismissing a record that is slow to arrive only
  // hides the card until it turns up, and then it reopens itself over
  // whatever the person has moved on to.
  overlayRequestId += 1;
  overlay.hidden = true;
  card.innerHTML = '';
  currentItemIndex = -1;
}

overlay.addEventListener('click', (e) => { if (e.target === overlay) closeItem(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeItem(); return; }
  if (overlay.hidden || currentItemIndex === -1) return;
  if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

let historyTimer = null;
q.addEventListener('input', () => {
  clearBtn.hidden = !q.value;
  pictureView = 'all';
  document.querySelector('.wrap').dataset.view = 'all';
  clearTimeout(timer);
  const value = q.value;
  clearTimeout(historyTimer);
  if (value.trim().length >= 2) {
    historyTimer = setTimeout(() => {
      if (q.value === value) rememberSearch({ key: 'text:' + value.trim().toLowerCase(), kind: 'text', text: value.trim(), label: value.trim() });
    }, 1500);
  }
  timer = setTimeout(() => {
    const myId = ++requestId;
    if (!value.trim()) {
      clearResults();
      return;
    }
    invoke('search', searchArgs(value, 0, false))
      .then(data => { if (myId === requestId) render(data, value); });
  }, 120);
});

q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(timer);
    searchAll();
  }
});

clearBtn.addEventListener('click', () => {
  q.value = '';
  clearBtn.hidden = true;
  clearResults();
  q.focus();
});
</script>
</body>
</html>
