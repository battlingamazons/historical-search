name: Build and test

# This app is written on a Mac but runs on Windows, and also builds for Linux.
# Each runner compiles it natively here -- no cross-compiling -- so a mistake
# that only shows up on one platform is caught in a few minutes rather than on
# the museum's machine.
#
# Paths below are relative to the repository root, which is the folder holding
# this .github directory.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # So a Windows build can be started from the Actions tab without pushing.
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the Windows build because macOS failed, or the reverse --
      # the difference between the two is the entire point of this workflow.
      fail-fast: false
      # macOS runners count ten times against the minutes of a private
      # repository, so the Mac build runs only for main and for tagged
      # releases. Branches, pull requests and manual runs elsewhere build
      # Windows and Linux only -- Windows being the platform this app is
      # actually used on.
      #
      # Deliberately not "dmg". Building one runs bundle_dmg.sh, which
      # drives Finder through AppleScript and fails on a machine with no
      # desktop session -- it fails locally in a sandbox for the same
      # reason. The .app is the same application; it is tarred below so
      # the executable bits survive the download.
      #
      # Linux is pinned to 22.04, not "latest": an AppImage bundles nothing
      # of the system C library, so it runs on distributions no older than
      # the one that built it. Building on the older release keeps it usable
      # on the widest range.
      matrix:
        include: ${{ fromJSON(
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
          && '[{"os":"windows-latest","label":"Windows","bundles":"msi,nsis"},{"os":"ubuntu-22.04","label":"Linux","bundles":"deb,appimage"},{"os":"macos-latest","label":"macOS","bundles":"app"}]'
          || '[{"os":"windows-latest","label":"Windows","bundles":"msi,nsis"},{"os":"ubuntu-22.04","label":"Linux","bundles":"deb,appimage"}]') }}

    steps:
      - uses: actions/checkout@v5

      # What Tauri's window (WebKitGTK) and its bundlers need on Linux.
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xdg-utils

      # The toolchain version comes from src-tauri/rust-toolchain.toml, so the
      # runner uses exactly the compiler this was developed against.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri plus a bundled SQLite is several minutes from cold.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/historical-search/src-tauri

      # The tests for reading scanned PDFs run the real Tesseract.
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      # On Windows the same step also copies it into the folder the installer
      # packs, so the society's computer needs nothing installed.
      - name: Bundle Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bundle-tesseract.ps1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/historical-search/package-lock.json

      - name: Install the Tauri command line tool
        working-directory: native/historical-search
        run: npm ci

      - name: Lint
        working-directory: native/historical-search/src-tauri
        run: cargo clippy --lib --no-default-features -- -D warnings

      # --no-default-features turns off the "live-data" feature, so the tests
      # that read the museum's actual collection are not compiled at all. They
      # are not being skipped or quietly passed: that data is not in this
      # repository and never will be, and a test that reported success without
      # its fixture would be worse than no test. What remains is everything
      # judgeable anywhere -- the DBF reader against malformed input, catalog
      # number matching, the SQLite schema handling, the image-URL parsing and
      # the diagnostics.
      # --nocapture so the checks that *report* rather than assert are
      # readable here. The index-swap test measures whether replacing a
      # database that something is reading is refused on this platform, which
      # is a question a Mac cannot answer; the answer is printed, not asserted.
      # --tests adds the integration tests, which start the built program
      # itself as a PDF reader -- the part the in-process tests cannot cover,
      # and one that depends on how each operating system starts a process.
      - name: Test (the platform-independent set)
        working-directory: native/historical-search/src-tauri
        run: cargo test --lib --tests --no-default-features -- --nocapture

      # The window's own logic, exercised against the page as shipped in a
      # headless browser. Needs no collection data, so it runs on both
      # platforms -- and the ordering guards it covers are exactly the sort of
      # thing that behaves differently when a machine is slower.
      - name: Test the window
        working-directory: native/historical-search
        run: npm test

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: native/historical-search
          args: --bundles ${{ matrix.bundles }}

      # Gather the installers into one flat folder before uploading.
      #
      # Without this the artifact keeps the whole build path, so downloading it
      # gives a zip with the installer six folders down
      # (native/historical-search/src-tauri/target/release/bundle/nsis/...),
      # which is a poor way to hand someone a thing to double-click.
      #
      # `shell: bash` because this one step has to run on both runners, and
      # Windows would otherwise use PowerShell.
      - name: Collect the installers
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          bundle=native/historical-search/src-tauri/target/release/bundle
          find "$bundle" -type f \( -name '*.msi' -o -name '*.exe' \
            -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          # A .app is a folder, and an artifact zip would strip the executable
          # bit on the way through, leaving something that downloads but will
          # not open. Tarring it keeps the permissions intact.
          if [ -d "$bundle/macos" ]; then
            ( cd "$bundle/macos" && tar -czf "$GITHUB_WORKSPACE/dist/historical-search-macos.tar.gz" *.app )
          fi
          echo "Ready to upload:"
          ls -la dist

      - name: Upload the installers
        uses: actions/upload-artifact@v5
        with:
          name: historical-search-${{ matrix.label }}
          path: dist/*
          # Fail loudly rather than silently publishing an empty artifact: a
          # green run with nothing to install is the worst outcome here.
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish a release
    needs: build
    # Only for a tagged version; ordinary pushes just leave artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
